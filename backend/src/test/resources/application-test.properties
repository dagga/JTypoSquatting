# Test configuration profile
spring.config.activate.on-profile=test

# In-memory H2 database for tests (avoids file lock issues)
# One database per Spring context, so that test classes do not see each other's data
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable auto database initialization
spring.jpa.hibernate.ddl-auto=none

# Logging for tests
logging.level.com.aleph.graymatter.jtyposquatting=DEBUG
logging.level.org.springframework=INFO

# The scan worker is enabled only by the tests that need it (it would otherwise check real domains)
jtypo.worker.enabled=false

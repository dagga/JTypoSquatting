server.port=8081
server.servlet.context-path=/
spring.application.name=jtyposquatting-api

# Virtual Threads (Java 21+) - Enabled for better I/O concurrency
spring.threads.virtual.enabled=true
spring.task.execution.pool.core-size=16
spring.task.execution.pool.max-size=128

# Jetty embedded server configuration
server.jetty.threads.max=200
server.jetty.threads.min=8

# SSE Configuration
spring.mvc.async.request-timeout=300000

# Outbound connections of the analysis engine (anti-SSRF)
# Never enable private addresses on a public deployment: generated domains may resolve to internal hosts
jtypo.outbound.allow-private-addresses=false
jtypo.outbound.allowed-ports=80,443
# Identifies the service to analysed sites; add a contact URL, e.g. "(compatible; JTypoSquatting/2.0; +https://example.org/bot)"
jtypo.outbound.user-agent=Mozilla/5.0 (compatible; JTypoSquatting/2.0)

# Screenshots (headless Chromium via Playwright)
# The Chromium sandbox requires unprivileged user namespaces; disable it only inside an isolated container
jtypo.screenshot.enabled=true
jtypo.screenshot.chromium-sandbox=true
jtypo.screenshot.timeout-ms=15000
jtypo.screenshot.max-concurrent=2

# Security: "oidc" (public web deployment, default) or "local" (desktop app, set by CombinedLauncher)
jtypo.security.mode=oidc
jtypo.security.post-login-url=/app
# OpenID Connect provider, discovered on first login (Keycloak in development: docker compose up keycloak)
jtypo.oidc.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/jtypo}
jtypo.oidc.client-id=${OIDC_CLIENT_ID:jtypo-web}
jtypo.oidc.client-secret=${OIDC_CLIENT_SECRET:dev-secret-change-me}
# Behind the reverse proxy, set FORWARD_HEADERS_STRATEGY=framework so that HTTPS and the public host are detected
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# Session cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Abuse protection (per user; per IP for anonymous calls). Counters are in memory, per instance.
jtypo.rate-limit.requests-per-minute=120
jtypo.quota.max-concurrent-scans=2
jtypo.quota.scans-per-day=50
jtypo.quota.max-domains-per-scan=50000
# Simultaneous outbound checks for the whole instance
jtypo.analysis.max-concurrent-checks=64

# Database: H2 in memory by default (desktop app, development); MySQL 8.4 for the web service:
#   DB_URL=jdbc:mysql://host:3306/jtypo  DB_USER=...  DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:h2:mem:jtypo;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
# Schema managed by Flyway, one migration set per database vendor
spring.flyway.locations=classpath:db/migration/{vendor}
# HTTP sessions in the database, shared by API instances (tables created by Flyway)
spring.session.jdbc.initialize-schema=never
spring.session.timeout=8h

# Shared cache of domain checks: a domain checked less than this many hours ago is not checked again
jtypo.cache.ttl-hours=24

# Screenshot storage: "filesystem" (desktop app, development) or "s3" (web service, any S3-compatible service)
jtypo.storage.type=${STORAGE_TYPE:filesystem}
jtypo.storage.directory=${STORAGE_DIRECTORY:${java.io.tmpdir}/jtyposquatting}
jtypo.storage.s3.endpoint=${S3_ENDPOINT:}
jtypo.storage.s3.region=${S3_REGION:us-east-1}
jtypo.storage.s3.bucket=${S3_BUCKET:jtypo-screenshots}
jtypo.storage.s3.access-key=${S3_ACCESS_KEY:}
jtypo.storage.s3.secret-key=${S3_SECRET_KEY:}
jtypo.storage.s3.path-style=${S3_PATH_STYLE:true}

# Monitoring (Actuator). Exposed on the management port in the api and worker profiles.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=jtyposquatting

# Data retention (purge every night on worker instances)
jtypo.retention.scan-days=90
jtypo.retention.check-days=30
jtypo.retention.cron=0 30 3 * * *

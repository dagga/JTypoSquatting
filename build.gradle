// Root project configuration
plugins {
    id 'org.springframework.boot' version '3.5.0' apply false
}

// Load version from gradle.properties
def projectVersion = project.hasProperty('version') ? project.getProperty('version') : '2.0-alpha1'

allprojects {
    group = 'com.aleph.graymatter'
    version = projectVersion

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    // Configure source sets to use standard Maven layout
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            resources.srcDirs = ['src/main/resources']
        }
        test {
            java.srcDirs = ['src/test/java']
            resources.srcDirs = ['src/test/resources']
        }
    }

    test {
        // Tests that contact real Internet sites (@Tag("network")) are opt-in:
        //   ./gradlew test -Dinclude.network=true
        // Testcontainers tests (MySQL, S3) run when a container engine is available, and are skipped otherwise.
        useJUnitPlatform {
            if (System.getProperty('include.network') != 'true') {
                excludeTags 'network'
            }
        }
        jvmArgs = []
    }
}

// Configuration pour le module shared
project(':shared') {
    dependencies {
        implementation 'com.google.guava:guava:33.1.0-jre'
        implementation 'com.google.code.gson:gson:2.10.1'

        // Language detection
        implementation 'com.github.pemistahl:lingua:1.2.1'

        // JSoup for HTML parsing
        implementation 'org.jsoup:jsoup:1.17.2'
        implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.0'

        // Testing
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

// Configuration pour le module backend
project(':backend') {
    apply plugin: 'org.springframework.boot'

    dependencies {
        implementation project(':shared')

        // Spring Boot for REST API
        implementation 'org.springframework.boot:spring-boot-starter-web:3.5.0'
        implementation 'org.springframework.boot:spring-boot-starter-jetty:3.5.0'

        // Authentication: OpenID Connect login, session cookie (BFF pattern)
        implementation 'org.springframework.boot:spring-boot-starter-security:3.5.0'
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-client:3.5.0'

        // Screenshot storage on any S3-compatible service (Netty client excluded: the Apache client is used)
        implementation('software.amazon.awssdk:s3:2.55.16') {
            exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        }

        // Rate limiting
        implementation 'com.bucket4j:bucket4j_jdk17-core:8.21.0'

        // Databases: MySQL in production, H2 for the desktop app and fast tests; schema managed by Flyway
        implementation 'org.springframework.boot:spring-boot-starter-jdbc:3.5.0'
        implementation 'com.h2database:h2:2.2.224'
        runtimeOnly 'com.mysql:mysql-connector-j:9.2.0'
        implementation 'org.flywaydb:flyway-core:11.7.2'
        runtimeOnly 'org.flywaydb:flyway-mysql:11.7.2'

        // HTTP sessions stored in the database (several API instances)
        implementation 'org.springframework.session:spring-session-jdbc:3.5.0'

        // Business logic dependencies
        implementation 'com.google.guava:guava:33.1.0-jre'
        implementation 'com.google.code.gson:gson:2.10.1'

        // JSoup for HTML parsing
        implementation 'org.jsoup:jsoup:1.17.2'

        // HTTP client with pluggable DNS resolver (anti-SSRF)
        implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.5'

        // Headless Chromium for screenshots
        implementation 'com.microsoft.playwright:playwright:1.63.0'

        // Language detection
        implementation 'com.github.pemistahl:lingua:1.2.1'

        // Testing
        testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.0'
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
        testImplementation 'org.springframework.security:spring-security-test:6.5.0'
        testImplementation 'org.springframework.boot:spring-boot-testcontainers:3.5.0'
        testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
        testImplementation 'org.testcontainers:mysql:1.21.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // Configure Spring Boot to find the main class
    tasks.withType(org.springframework.boot.gradle.tasks.bundling.BootJar) {
        mainClass = 'com.aleph.graymatter.jtyposquatting.JTypoSquattingApplication'
    }

    // Installs the Chromium build used by Playwright for screenshots.
    // Use -PwithDeps to also install system libraries (CI, requires sudo).
    tasks.register('installPlaywrightBrowsers', JavaExec) {
        description = 'Installs the headless Chromium used for screenshots'
        group = 'application'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.microsoft.playwright.CLI'
        args = ['install'] + (project.hasProperty('withDeps') ? ['--with-deps'] : []) + ['chromium']
    }

}

// Configuration pour le module frontend
project(':frontend') {
    apply plugin: 'java'

    dependencies {
        implementation project(':shared')
        implementation project(':backend')

        // Spring Boot dependencies (needed for backend embedded in fatJar)
        implementation 'org.springframework.boot:spring-boot-starter-web:3.5.0'
        implementation 'org.springframework.boot:spring-boot-starter-jetty:3.5.0'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc:3.5.0'
        implementation 'com.h2database:h2:2.2.224'

        // HTTP Client for REST calls
        implementation 'com.google.guava:guava:33.1.0-jre'
        implementation 'com.google.code.gson:gson:2.10.1'

        // JSoup for HTML parsing
        implementation 'org.jsoup:jsoup:1.17.2'

        // Language detection
        implementation 'com.github.pemistahl:lingua:1.2.1'

        // SLF4J logging
        implementation 'org.slf4j:slf4j-api:2.0.16'
        runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'

        // Testing
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        // No JavaFX dependencies: using Swing for UI.
    }

    jar {
        archiveFileName = 'JTypoSquatting-frontend.jar'
        duplicatesStrategy = 'exclude'
        manifest {
            attributes 'Main-Class': 'com.aleph.graymatter.jtyposquatting.ui.JTypoFrame'
        }
    }

    // Task to create a fat JAR with all dependencies (optimized - excludes language models)
    tasks.register('fatJar', Jar) {
        archiveFileName = 'JTypoSquatting.jar'
        duplicatesStrategy = 'exclude'
        manifest {
            attributes 'Main-Class': 'com.aleph.graymatter.jtyposquatting.CombinedLauncher'
        }
        from {
            configurations.runtimeClasspath.collect { 
                if (it.isDirectory()) { 
                    it 
                } else {
                    // Exclude language models from lingua library (not needed in frontend)
                    zipTree(it).matching {
                        exclude 'language-models/**'
                        exclude '**/lingua/language-models/**'
                    }
                }
            }
        }
        with jar
    }

    // Task to copy fat JAR to project root directory
    tasks.register('copyFatJar', Copy) {
        dependsOn fatJar
        from "${buildDir}/libs/JTypoSquatting.jar"
        into "${project.rootDir}"
        
        // Avoid conflicts with other tasks
        outputs.upToDateWhen { false }
    }

    // Task to run frontend
    tasks.register('run', JavaExec) {
        description = 'Runs the frontend application'
        group = 'application'

        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.aleph.graymatter.jtyposquatting.ui.JTypoFrame'
        jvmArgs = [
            '-Djava.awt.headless=false',
            '-Dawt.toolkit=sun.awt.X11.XToolkit',
            '-Djava.awt.graphicsenv=sun.awt.X11GraphicsEnvironment',
            '--add-opens', 'java.desktop/javax.swing=ALL-UNNAMED',
            '--add-opens', 'java.desktop/java.awt=ALL-UNNAMED'
        ]
    }

    // jpackage task to create installer
    def jpackagePath = System.getenv('JPACKAGE_HOME') ?: '/usr/bin/jpackage'

    tasks.register('packageApp', Exec) {
        description = 'Creates native app image using jpackage (cross-platform)'
        group = 'application'

        dependsOn fatJar

        workingDir = project.rootDir

        def outputDir = "${project.rootDir}/dist"

        commandLine jpackagePath,
            '--input', "${project.buildDir}/libs",
            '--main-jar', 'JTypoSquatting.jar',
            '--name', 'JTypoSquatting',
            '--app-version', projectVersion,
            '--vendor', 'Aleph Graymatter',
            '--description', 'TypoSquatting detection tool',
            '--type', 'app-image',
            '--dest', outputDir,
            '--java-options', '-Djava.awt.headless=false',
            '--java-options', '--add-opens=java.desktop/javax.swing=ALL-UNNAMED',
            '--java-options', '--add-opens=java.desktop/java.awt=ALL-UNNAMED'
    }

    tasks.register('packageAppMsi', Exec) {
        description = 'Creates MSI installer for Windows'
        group = 'application'

        dependsOn fatJar

        workingDir = project.rootDir

        def outputDir = "${project.rootDir}/dist"

        commandLine jpackagePath,
            '--input', "${project.buildDir}/libs",
            '--main-jar', 'JTypoSquatting.jar',
            '--name', 'JTypoSquatting',
            '--app-version', projectVersion,
            '--vendor', 'Aleph Graymatter',
            '--description', 'TypoSquatting detection tool',
            '--type', 'msi',
            '--dest', outputDir,
            '--java-options', '-Djava.awt.headless=false',
            '--java-options', '--add-opens=java.desktop/javax.swing=ALL-UNNAMED',
            '--java-options', '--add-opens=java.desktop/java.awt=ALL-UNNAMED'
    }

    tasks.register('packageAppExe', Exec) {
        description = 'Creates EXE installer for Windows'
        group = 'application'

        dependsOn fatJar

        workingDir = project.rootDir

        def outputDir = "${project.rootDir}/dist"

        commandLine jpackagePath,
            '--input', "${project.buildDir}/libs",
            '--main-jar', 'JTypoSquatting.jar',
            '--name', 'JTypoSquatting',
            '--app-version', projectVersion,
            '--vendor', 'Aleph Graymatter',
            '--description', 'TypoSquatting detection tool',
            '--type', 'exe',
            '--dest', outputDir,
            '--java-options', '-Djava.awt.headless=false',
            '--java-options', '--add-opens=java.desktop/javax.swing=ALL-UNNAMED',
            '--java-options', '--add-opens=java.desktop/java.awt=ALL-UNNAMED',
            '--win-console'
    }
}

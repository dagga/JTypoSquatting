# Reverse proxy: frontend and API on the same origin (no CORS, session cookie shared).
# TLS is expected to be terminated in front of this proxy, or add a 443 server with your certificates.

limit_req_zone $binary_remote_addr zone=jtypo_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=jtypo_login:10m rate=2r/s;

upstream jtypo_api { server api:8081; keepalive 32; }
upstream jtypo_web { server web:3000; keepalive 32; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Set to https when TLS is terminated upstream of this proxy
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Live results (SSE): no buffering, long-lived connections
    location ~ ^/api/scans/[^/]+/events$ {
        limit_req zone=jtypo_api burst=20 nodelay;
        proxy_pass http://jtypo_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location /api/ {
        limit_req zone=jtypo_api burst=50 nodelay;
        proxy_pass http://jtypo_api;
    }

    # OpenID Connect login and logout, handled by the backend
    location ~ ^/(oauth2/|login/oauth2/|logout$) {
        limit_req zone=jtypo_login burst=10 nodelay;
        proxy_pass http://jtypo_api;
    }

    location / {
        proxy_pass http://jtypo_web;
    }
}

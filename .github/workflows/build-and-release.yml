# GitHub Actions Workflow for JTypoSquatting
# Builds and publishes the executable JAR on releases
#
# Note: screenshots use headless Chromium (Playwright), no display is required.

name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install headless Chromium and its system dependencies
      run: ./gradlew :backend:installPlaywrightBrowsers -PwithDeps --no-daemon

    # Testcontainers (MySQL, S3Mock) use the Docker engine of the runner
    - name: Run tests
      run: ./gradlew test --no-daemon --info --stacktrace

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          **/build/reports/tests/
          **/build/test-results/
        retention-days: 7

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Install Chromium for end-to-end tests
      run: npx playwright install --with-deps chromium

    - name: End-to-end tests (production build, simulated backend)
      run: npm run test:e2e

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: web/test-results/
        retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test --no-daemon

    - name: Build optimized fat JAR
      run: ./gradlew :frontend:fatJar --no-daemon

    - name: Get version from gradle.properties
      id: version
      run: |
        VERSION=$(grep "^version=" gradle.properties 2>/dev/null | cut -d'=' -f2 || echo "2.0-alpha1")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using version: $VERSION"

    - name: Copy JAR to artifacts directory
      run: |
        mkdir -p artifacts
        cp frontend/build/libs/JTypoSquatting.jar artifacts/JTypoSquatting-${{ steps.version.outputs.version }}.jar
        cp frontend/build/libs/JTypoSquatting.jar artifacts/JTypoSquatting.jar

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: JTypoSquatting-JAR
        path: artifacts/*.jar
        retention-days: 30

    - name: Create GitHub Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/JTypoSquatting-${{ steps.version.outputs.version }}.jar
          artifacts/JTypoSquatting.jar
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    needs: [test, web]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: backend/Dockerfile
            target: api
          - name: worker
            context: .
            file: backend/Dockerfile
            target: worker
          - name: web
            context: web
            file: web/Dockerfile
            target: run

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/jtyposquatting-${{ matrix.name }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha

    - name: Build (and push outside pull requests)
      uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        target: ${{ matrix.target }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  analyze-jar-size:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: JTypoSquatting-JAR
        path: ./artifacts

    - name: Analyze JAR size
      run: |
        echo "=== JAR File Size ==="
        ls -lh artifacts/*.jar
        echo ""
        echo "=== JAR Contents Summary ==="
        for jar in artifacts/*.jar; do
          echo "File: $jar"
          echo "Size: $(du -h $jar | cut -f1)"
          echo "Entries: $(unzip -l $jar | wc -l)"
          echo ""
          echo "Top 10 largest entries:"
          unzip -l $jar | sort -k1 -nr | head -10 | awk '{printf "%.2f MB\t%s\n", $1/1024/1024, $4}'
        done

    - name: Upload size report
      uses: actions/upload-artifact@v4
      with:
        name: jar-size-report
        path: artifacts/
        retention-days: 7
